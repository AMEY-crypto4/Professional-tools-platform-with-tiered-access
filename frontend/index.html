<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A&amp;A Creations — Tools</title>
<script src="config.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1c2333; --text2: #64748b;
    --border: #e2e6ec; --accent: #4f46e5; --accent-dark: #4338ca;
    --green: #16a34a; --amber: #d97706; --red: #dc2626; --gray: #6b7280;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); }
  a { color: var(--accent); }
  button { cursor: pointer; font-family: inherit; }
  .btn { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 14px; font-weight: 500; }
  .btn:hover { background: #f0f1f5; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-danger { color: var(--red); border-color: #fca5a5; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  input, select, textarea { padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); font-size: 14px; font-family: inherit; width: 100%; }
  label { font-size: 12px; color: var(--text2); font-weight: 600; display: block; margin-bottom: 4px; }
  .field { margin-bottom: 12px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px; background: var(--card); border-bottom: 1px solid var(--border); }
  .topbar b { font-size: 17px; }
  .container { max-width: 1080px; margin: 0 auto; padding: 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
  .badge-free { background: #eef2ff; color: var(--accent); }
  .badge-pro { background: #fef3c7; color: var(--amber); }
  .badge-soon { background: #f1f5f9; color: var(--gray); }
  .badge-owner { background: #dcfce7; color: var(--green); }
  .status-draft { background:#f1f5f9; color:#475569; }
  .status-sent { background:#e0f2fe; color:#0369a1; }
  .status-paid { background:#dcfce7; color:#15803d; }
  .status-overdue { background:#fee2e2; color:#b91c1c; }
  .status-void { background:#f1f5f9; color:#94a3b8; text-decoration: line-through; }
  .status-pill { padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .progress { height: 6px; border-radius: 999px; background: #eef0f4; overflow: hidden; margin: 8px 0; }
  .progress > div { height: 100%; background: var(--accent); }
  .progress.full > div { background: var(--red); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--text2); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  .row { display: flex; gap: 10px; align-items: flex-end; }
  .row > * { flex: 1; }
  .muted { color: var(--text2); font-size: 13px; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal { background: #fff; border-radius: 14px; padding: 26px; width: 420px; max-width: 92vw; max-height: 85vh; overflow-y: auto; }
  .toast { position: fixed; top: 18px; right: 18px; z-index: 100; padding: 12px 18px; border-radius: 8px; background: #1c2333; color: #fff; font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.15); }
  .toast.error { background: var(--red); }
  .toast.success { background: var(--green); }
  .link-btn { background: none; border: none; color: var(--accent); font-size: 13px; padding: 0; }
  .item-row { display: grid; grid-template-columns: 1fr 70px 110px 32px; gap: 8px; margin-bottom: 8px; align-items: center; }
  .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .auth-card { width: 380px; max-width: 92vw; }
  .tabs { display: flex; gap: 4px; margin-bottom: 18px; border-bottom: 1px solid var(--border); }
  .tabs button { background: none; border: none; padding: 10px 4px; margin-right: 18px; font-size: 14px; font-weight: 600; color: var(--text2); border-bottom: 2px solid transparent; }
  .tabs button.active { color: var(--accent); border-color: var(--accent); }
  .two-col { display: grid; grid-template-columns: 280px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 800px) { .two-col { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="app"></div>

<script>
const API_BASE = window.AACREATIONS_API_BASE || 'http://localhost:4000/api';
const $ = (id) => document.getElementById(id);
const app = $('app');

let TOKEN = localStorage.getItem('aac_token') || null;
let USER = JSON.parse(localStorage.getItem('aac_user') || 'null');
let VIEW = 'dashboard';
let TOOLS = [];
let IG_CLIENTS = [];
let IG_INVOICES = [];
let IG_USAGE = null;
let IG_LINE_ITEMS = [{ description: '', quantity: 1, unitPrice: '' }];

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function money(cents, currency) {
  const symbols = { usd: '$', eur: '€', gbp: '£', inr: '₹', ngn: '₦' };
  const sym = symbols[(currency || 'usd').toLowerCase()] || ((currency || 'USD').toUpperCase() + ' ');
  return `${sym}${(Number(cents || 0) / 100).toFixed(2)}`;
}
// API dates come back through JSON.stringify already as ISO strings (Date's
// own toJSON runs server-side), never as Date objects on this side — so
// just slice the string instead of trying to re-parse it.
function dateOnly(value) {
  return typeof value === 'string' ? value.slice(0, 10) : new Date(value).toISOString().slice(0, 10);
}
function showToast(msg, type = '') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

async function apiFetch(path, opts = {}) {
  const headers = Object.assign({}, opts.headers || {});
  if (opts.body && !(opts.body instanceof FormData)) headers['Content-Type'] = 'application/json';
  if (TOKEN) headers['Authorization'] = `Bearer ${TOKEN}`;
  const res = await fetch(`${API_BASE}${path}`, { ...opts, headers });
  if (res.status === 401 && TOKEN) {
    signOut();
    throw new Error('Session expired — please sign in again.');
  }
  const contentType = res.headers.get('content-type') || '';
  const data = contentType.includes('application/json') ? await res.json() : null;
  if (!res.ok) {
    const err = new Error((data && data.error) || `Request failed (${res.status})`);
    err.status = res.status;
    throw err;
  }
  return data;
}

function saveSession(token, user) {
  TOKEN = token; USER = user;
  localStorage.setItem('aac_token', token);
  localStorage.setItem('aac_user', JSON.stringify(user));
}
function signOut() {
  TOKEN = null; USER = null;
  localStorage.removeItem('aac_token'); localStorage.removeItem('aac_user');
  VIEW = 'dashboard';
  renderRoot();
}

// ---------------------------------------------------------------- Auth ----
let AUTH_MODE = 'login';
function renderAuth() {
  app.innerHTML = `
    <div class="auth-wrap">
      <div class="card auth-card">
        <h2 style="margin-top:0">A&amp;A Creations</h2>
        <p class="muted" style="margin-top:-8px">Professional tools for your business — start free, upgrade any time.</p>
        <div class="tabs">
          <button id="tabLogin" class="${AUTH_MODE==='login'?'active':''}">Sign in</button>
          <button id="tabSignup" class="${AUTH_MODE==='signup'?'active':''}">Create account</button>
        </div>
        <form id="authForm">
          ${AUTH_MODE === 'signup' ? `
            <div class="field"><label>Your name</label><input id="af_name" required></div>
            <div class="field"><label>Company name (optional)</label><input id="af_company"></div>
          ` : ''}
          <div class="field"><label>Email</label><input id="af_email" type="email" required></div>
          <div class="field"><label>Password</label><input id="af_password" type="password" minlength="8" required></div>
          <button class="btn btn-primary" style="width:100%" type="submit">${AUTH_MODE === 'signup' ? 'Create account' : 'Sign in'}</button>
        </form>
      </div>
    </div>
  `;
  $('tabLogin').onclick = () => { AUTH_MODE = 'login'; renderAuth(); };
  $('tabSignup').onclick = () => { AUTH_MODE = 'signup'; renderAuth(); };
  $('authForm').onsubmit = async (e) => {
    e.preventDefault();
    const email = $('af_email').value.trim();
    const password = $('af_password').value;
    try {
      let data;
      if (AUTH_MODE === 'signup') {
        const displayName = $('af_name').value.trim();
        const companyName = $('af_company').value.trim();
        data = await apiFetch('/auth/signup', { method: 'POST', body: JSON.stringify({ email, password, displayName, companyName }) });
      } else {
        data = await apiFetch('/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) });
      }
      saveSession(data.token, data.user);
      showToast(`Welcome${data.user.isOwner ? ' back, owner' : ''}!`, 'success');
      await renderRoot();
    } catch (err) {
      showToast(err.message, 'error');
    }
  };
}

// -------------------------------------------------------------- Layout ----
function shell(inner) {
  app.innerHTML = `
    <div class="topbar">
      <b>A&amp;A Creations</b>
      <div style="display:flex; align-items:center; gap:14px;">
        <span class="muted">${escapeHtml(USER.displayName)} ${USER.isOwner ? '<span class="badge badge-owner">Owner</span>' : ''}</span>
        <button class="btn btn-sm" id="signOutBtn">Sign out</button>
      </div>
    </div>
    <div class="container">${inner}</div>
  `;
  $('signOutBtn').onclick = signOut;
}

// ------------------------------------------------------------ Dashboard ----
async function loadTools() {
  const data = await apiFetch('/tools');
  TOOLS = data.tools;
}

function tierBadge(tool) {
  if (!tool.is_active) return `<span class="badge badge-soon">Coming soon</span>`;
  if (tool.isOwnerBypass) return `<span class="badge badge-owner">Free (Owner)</span>`;
  return tool.tier === 'pro' ? `<span class="badge badge-pro">Pro</span>` : `<span class="badge badge-free">Free</span>`;
}

async function renderDashboard() {
  shell(`<p>Loading…</p>`);
  try {
    await loadTools();
  } catch (err) {
    showToast(err.message, 'error');
    return;
  }
  const cards = TOOLS.map((t) => `
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:flex-start;">
        <h3 style="margin:0 0 6px">${escapeHtml(t.name)}</h3>
        ${tierBadge(t)}
      </div>
      <p class="muted">${escapeHtml(t.description)}</p>
      ${t.is_active ? `<button class="btn btn-primary" data-open="${t.slug}">Open</button>
        ${t.tier === 'free' && !t.isOwnerBypass ? `<button class="btn" style="margin-left:8px" data-upgrade="${t.slug}">Upgrade</button>` : ''}`
        : `<button class="btn" disabled>Coming soon</button>`}
    </div>
  `).join('');
  shell(`<h2>Your tools</h2><div class="grid">${cards}</div>`);
  app.querySelectorAll('[data-open]').forEach((btn) => btn.onclick = () => openTool(btn.dataset.open));
  app.querySelectorAll('[data-upgrade]').forEach((btn) => btn.onclick = () => openUpgradeModal(btn.dataset.upgrade));
}

const TOOL_RENDERERS = {
  'invoice-generator': renderInvoiceGenerator,
  'appointment-booking': () => renderAppointmentBooking(),
  'expense-tracker': () => renderExpenseTracker(),
  'membership-management': () => renderMembershipManagement(),
  'leave-management': () => renderLeaveManagement(),
  'inventory-management': () => renderInventoryManagement(),
  'staff-attendance': () => renderStaffAttendance(),
  'property-management': () => renderPropertyManagement(),
  'queue-management': () => renderQueueManagement(),
};
function openTool(slug) {
  const renderer = TOOL_RENDERERS[slug];
  if (renderer) { VIEW = slug; renderer(); }
}

// Shared by every resource-capped tool view (max_services, max_members,
// max_properties, ...) — the monthly-counter tools (Invoice Generator,
// Appointment Booking's appointment count, Expense Tracker) have their own
// /usage endpoint instead, since those reset every period rather than being
// freed up by deleting a record.
async function getToolMeta(slug) {
  const { tools } = await apiFetch('/tools');
  return tools.find((t) => t.slug === slug);
}
function capBannerHtml(toolSlug, tier, used, cap, label) {
  if (cap == null) return `<span class="muted">Unlimited ${label} on your ${tier} plan.</span>`;
  const atCap = used >= cap;
  const pct = Math.min(100, Math.round((used / cap) * 100));
  return `<span class="muted">${used} / ${cap} ${label} (${tier} plan)</span>
    <div class="progress ${atCap ? 'full' : ''}"><div style="width:${pct}%"></div></div>
    ${atCap ? `<button class="link-btn" data-upgrade="${toolSlug}">Upgrade to Pro for more ${label} &rarr;</button>` : ''}`;
}
function wireUpgradeLinks() {
  app.querySelectorAll('[data-upgrade]').forEach((btn) => btn.onclick = () => openUpgradeModal(btn.dataset.upgrade));
}
function backLinkHtml() { return `<button class="link-btn" id="backBtn">&larr; Back to tools</button>`; }
function wireBackLink() { $('backBtn').onclick = () => { VIEW = 'dashboard'; renderDashboard(); }; }

// ------------------------------------------------------------ Upgrade -----
async function openUpgradeModal(toolSlug) {
  let tiers;
  try {
    const data = await apiFetch(`/tools/${toolSlug}/tiers`);
    tiers = data.tiers;
  } catch (err) { return showToast(err.message, 'error'); }

  const currentTool = TOOLS.find((t) => t.slug === toolSlug);
  const isPro = currentTool?.tier === 'pro' && !currentTool?.isOwnerBypass;

  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <h3 style="margin-top:0">${isPro ? 'Manage' : 'Upgrade'} ${escapeHtml(currentTool?.name || toolSlug)}</h3>
      ${tiers.map((t) => `
        <div class="card" style="margin-bottom:10px;">
          <b style="text-transform:capitalize">${t.tier}</b> —
          ${t.monthly_price_cents === 0 ? 'Free' : `${money(t.monthly_price_cents, t.currency)}/mo`}
          <ul class="muted" style="padding-left:18px; margin:8px 0;">
            ${Object.entries(t.limits).map(([k, v]) => `<li>${escapeHtml(k.replace(/_/g,' '))}: ${v === null ? 'unlimited' : String(v)}</li>`).join('')}
          </ul>
          ${t.monthly_price_cents > 0 && !isPro ? `<button class="btn btn-primary" data-checkout="${t.tier}">Upgrade to ${t.tier}</button>` : ''}
          ${t.monthly_price_cents > 0 && isPro ? `<button class="btn btn-danger" id="cancelSub">Cancel Pro plan</button>` : ''}
        </div>
      `).join('')}
      <button class="btn" id="closeModal" style="width:100%">Close</button>
    </div>
  `;
  document.body.appendChild(backdrop);
  $('closeModal').onclick = () => backdrop.remove();

  backdrop.querySelectorAll('[data-checkout]').forEach((btn) => btn.onclick = () => startCheckout(toolSlug, btn.dataset.checkout, backdrop));

  const cancelBtn = $('cancelSub');
  if (cancelBtn) cancelBtn.onclick = async () => {
    if (!confirm(`Cancel your Pro plan for ${currentTool?.name}? You'll drop back to the free plan's limits immediately.`)) return;
    try {
      await apiFetch('/billing/cancel', { method: 'POST', body: JSON.stringify({ toolSlug }) });
      showToast('Subscription cancelled', 'success');
      backdrop.remove();
      if (VIEW === 'dashboard') renderDashboard();
    } catch (err) { showToast(err.message, 'error'); }
  };
}

function billingErrorMessage(err) {
  return err.status === 501 ? "Billing isn't set up yet — ask the site owner to configure Razorpay or Stripe." : err.message;
}

async function startCheckout(toolSlug, tier, backdrop) {
  let session;
  try {
    session = await apiFetch('/billing/checkout', { method: 'POST', body: JSON.stringify({ toolSlug, tier }) });
  } catch (err) {
    return showToast(billingErrorMessage(err), 'error');
  }

  if (session.provider === 'stripe') {
    window.location.href = session.url;
    return;
  }

  if (session.provider === 'razorpay') {
    if (typeof Razorpay === 'undefined') {
      return showToast('Could not load the payment widget — check your connection and try again.', 'error');
    }
    const rzp = new Razorpay({
      key: session.keyId,
      subscription_id: session.subscriptionId,
      name: session.name,
      description: session.description,
      prefill: { email: session.prefillEmail, name: session.prefillName },
      theme: { color: '#4f46e5' },
      handler: async (response) => {
        try {
          await apiFetch('/billing/verify', { method: 'POST', body: JSON.stringify({
            toolSlug,
            razorpay_payment_id: response.razorpay_payment_id,
            razorpay_subscription_id: response.razorpay_subscription_id,
            razorpay_signature: response.razorpay_signature,
          }) });
          showToast('Upgrade successful — welcome to Pro!', 'success');
          backdrop?.remove();
          if (VIEW === 'dashboard') renderDashboard();
          else openTool(VIEW);
        } catch (err) {
          showToast(err.message, 'error');
        }
      },
      modal: { ondismiss: () => showToast('Upgrade cancelled — no changes made.', '') },
    });
    rzp.on('payment.failed', (resp) => showToast(`Payment failed: ${resp.error.description}`, 'error'));
    rzp.open();
  }
}

// ------------------------------------------------------- Invoice Generator
async function loadInvoiceGeneratorData() {
  const [clientsRes, invoicesRes, usageRes] = await Promise.all([
    apiFetch('/invoice-generator/clients'),
    apiFetch('/invoice-generator/invoices'),
    apiFetch('/invoice-generator/invoices/usage'),
  ]);
  IG_CLIENTS = clientsRes.clients;
  IG_INVOICES = invoicesRes.invoices;
  IG_USAGE = usageRes.usage;
}

function statusPillHtml(status) {
  return `<span class="status-pill status-${status}">${status}</span>`;
}

async function renderInvoiceGenerator() {
  shell(`<p>Loading…</p>`);
  try {
    await loadInvoiceGeneratorData();
  } catch (err) {
    showToast(err.message, 'error');
    return;
  }

  const usagePct = IG_USAGE.cap ? Math.min(100, Math.round((IG_USAGE.used / IG_USAGE.cap) * 100)) : 0;
  const atCap = IG_USAGE.cap != null && IG_USAGE.used >= IG_USAGE.cap;
  const usageHtml = IG_USAGE.cap == null
    ? `<span class="muted">Unlimited invoices on your ${IG_USAGE.tier} plan.</span>`
    : `<span class="muted">${IG_USAGE.used} / ${IG_USAGE.cap} invoices used this month (${IG_USAGE.tier} plan)</span>
       <div class="progress ${atCap ? 'full' : ''}"><div style="width:${usagePct}%"></div></div>
       ${atCap ? `<button class="link-btn" id="usageUpgrade">Upgrade to Pro for unlimited invoices →</button>` : ''}`;

  const clientOptions = IG_CLIENTS.map((c) => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
  const clientRows = IG_CLIENTS.map((c) => `
    <tr><td>${escapeHtml(c.name)}<br><span class="muted">${escapeHtml(c.email || '')}</span></td>
    <td><button class="link-btn" data-del-client="${c.id}">Delete</button></td></tr>
  `).join('') || `<tr><td colspan="2" class="muted">No clients yet.</td></tr>`;

  const invoiceRows = IG_INVOICES.map((inv) => `
    <tr>
      <td>${escapeHtml(inv.invoice_number)} ${inv.is_recurring ? '<span class="muted">(recurring)</span>' : ''}</td>
      <td>${escapeHtml(inv.client_name)}</td>
      <td>
        <select data-status="${inv.id}">
          ${['draft','sent','paid','overdue','void'].map((s) => `<option value="${s}" ${s===inv.status?'selected':''}>${s}</option>`).join('')}
        </select>
      </td>
      <td>${new Date(inv.issue_date).toISOString().slice(0,10)}</td>
      <td>${money(inv.total_cents, inv.currency)}</td>
      <td>
        <button class="link-btn" data-pdf="${inv.id}">PDF</button>
        ${inv.status === 'draft' ? `<button class="link-btn" data-del-invoice="${inv.id}" style="color:var(--red)">Delete</button>` : ''}
      </td>
    </tr>
  `).join('') || `<tr><td colspan="6" class="muted">No invoices yet — create your first one below.</td></tr>`;

  shell(`
    <button class="link-btn" id="backBtn">&larr; Back to tools</button>
    <h2 style="margin-top:8px">Invoice Generator</h2>
    <div class="card" style="margin-bottom:20px;">${usageHtml}</div>
    <div class="two-col">
      <div>
        <div class="card" style="margin-bottom:16px;">
          <h4 style="margin-top:0">Clients</h4>
          <table>${clientRows}</table>
        </div>
        <div class="card">
          <h4 style="margin-top:0">Add a client</h4>
          <form id="newClientForm">
            <div class="field"><label>Name</label><input id="nc_name" required></div>
            <div class="field"><label>Email</label><input id="nc_email" type="email"></div>
            <button class="btn btn-primary" style="width:100%">Add client</button>
          </form>
        </div>
      </div>
      <div>
        <div class="card" style="margin-bottom:16px;">
          <h4 style="margin-top:0">Invoices</h4>
          <table>
            <thead><tr><th>Number</th><th>Client</th><th>Status</th><th>Issued</th><th>Total</th><th></th></tr></thead>
            <tbody>${invoiceRows}</tbody>
          </table>
        </div>
        <div class="card">
          <h4 style="margin-top:0">New invoice</h4>
          ${IG_CLIENTS.length === 0 ? '<p class="muted">Add a client first.</p>' : `
          <form id="newInvoiceForm">
            <div class="row">
              <div class="field"><label>Client</label><select id="ni_client">${clientOptions}</select></div>
              <div class="field"><label>Issue date</label><input id="ni_issue" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
              <div class="field"><label>Due date</label><input id="ni_due" type="date"></div>
            </div>
            <div class="field"><label>Tax %</label><input id="ni_tax" type="number" min="0" step="0.01" value="0" style="max-width:120px"></div>
            <label>Line items</label>
            <div id="itemsWrap"></div>
            <button type="button" class="link-btn" id="addItemBtn">+ Add line item</button>
            <div class="field" style="margin-top:12px"><label>Notes</label><textarea id="ni_notes" rows="2"></textarea></div>
            <div class="field">
              <label><input type="checkbox" id="ni_recurring" style="width:auto; margin-right:6px;">Recurring invoice ${IG_USAGE.tier==='free' ? '(Pro feature)' : ''}</label>

    catch (err) { showToast(err.message, 'error'); }
  });

    recurringCheckbox.onchange = () => { $('ni_interval').style.display = recurringCheckbox.checked ? 'block' : 'none'; };
    IG_LINE_ITEMS = [{ description: '', quantity: 1, unitPrice: '' }];
    renderItemRows();
    $('addItemBtn').onclick = () => { IG_LINE_ITEMS.push({ description: '', quantity: 1, unitPrice: '' }); renderItemRows(); };
    $('newInvoiceForm').onsubmit = submitNewInvoice;
    $('ni_tax').oninput = updateInvoiceTotalPreview;
  }
}

function renderItemRows() {
  const wrap = $('itemsWrap');
  wrap.innerHTML = IG_LINE_ITEMS.map((item, i) => `
    <div class="item-row">
      <input placeholder="Description" data-item-desc="${i}" value="${escapeHtml(item.description)}">
      <input type="number" min="0" step="0.01" placeholder="Qty" data-item-qty="${i}" value="${item.quantity}">
      <input type="number" min="0" step="0.01" placeholder="Unit price" data-item-price="${i}" value="${item.unitPrice}">
      <button type="button" class="link-btn" data-item-remove="${i}" style="color:var(--red)">✕</button>
    </div>
  `).join('');
  wrap.querySelectorAll('[data-item-desc]').forEach((el) => el.oninput = () => { IG_LINE_ITEMS[el.dataset.itemDesc].description = el.value; });
  wrap.querySelectorAll('[data-item-qty]').forEach((el) => el.oninput = () => { IG_LINE_ITEMS[el.dataset.itemQty].quantity = el.value; updateInvoiceTotalPreview(); });
  wrap.querySelectorAll('[data-item-price]').forEach((el) => el.oninput = () => { IG_LINE_ITEMS[el.dataset.itemPrice].unitPrice = el.value; updateInvoiceTotalPreview(); });
  wrap.querySelectorAll('[data-item-remove]').forEach((el) => el.onclick = () => {
    if (IG_LINE_ITEMS.length > 1) { IG_LINE_ITEMS.splice(el.dataset.itemRemove, 1); renderItemRows(); updateInvoiceTotalPreview(); }
  });
  updateInvoiceTotalPreview();
}

function updateInvoiceTotalPreview() {
  const subtotal = IG_LINE_ITEMS.reduce((sum, i) => sum + (Number(i.quantity) || 0) * (Number(i.unitPrice) || 0), 0);
  const tax = Number($('ni_tax')?.value) || 0;
  const total = subtotal * (1 + tax / 100);
  const el = $('ni_total');
  if (el) el.textContent = `Total: ${money(Math.round(total * 100), 'usd')}`;
}

async function submitNewInvoice(e) {
  e.preventDefault();
  const isRecurring = $('ni_recurring').checked;
  const payload = {
    clientId: Number($('ni_client').value),
    issueDate: $('ni_issue').value || undefined,
    dueDate: $('ni_due').value || undefined,
    taxPercent: Number($('ni_tax').value) || 0,
    notes: $('ni_notes').value.trim() || undefined,
    isRecurring,
    recurrenceInterval: isRecurring ? $('ni_interval').value : undefined,
    items: IG_LINE_ITEMS.filter((i) => i.description).map((i) => ({
      description: i.description, quantity: Number(i.quantity) || 1, unitPriceCents: Math.round(Number(i.unitPrice) * 100) || 0,
    })),
  };
  try {
    await apiFetch('/invoice-generator/invoices', { method: 'POST', body: JSON.stringify(payload) });
    showToast('Invoice created', 'success');
    renderInvoiceGenerator();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

async function viewInvoicePdf(id) {
  try {
    const res = await fetch(`${API_BASE}/invoice-generator/invoices/${id}/pdf`, { headers: { Authorization: `Bearer ${TOKEN}` } });
    if (!res.ok) throw new Error('Could not load PDF');
    const blob = await res.blob();
    window.open(URL.createObjectURL(blob), '_blank');
  } catch (err) {
    showToast(err.message, 'error');
  }
}

function openRecordPaymentModal(memberId) {
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  const today = new Date().toISOString().slice(0, 10);
  const nextMonth = new Date(Date.now() + 30 * 86400000).toISOString().slice(0, 10);
  backdrop.innerHTML = `
    <div class="modal">
      <h3 style="margin-top:0">Record payment</h3>
      <form id="paymentForm">
        <div class="field"><label>Amount</label><input id="pf_amount" type="number" step="0.01" required></div>
        <div class="row">
          <div class="field"><label>Period start</label><input id="pf_start" type="date" value="${today}"></div>
          <div class="field"><label>Period end</label><input id="pf_end" type="date" value="${nextMonth}"></div>
        </div>
        <button class="btn btn-primary" style="width:100%">Save payment</button>
      </form>
      <button class="btn" id="closeModal" style="width:100%; margin-top:8px;">Cancel</button>
    </div>
  `;
  document.body.appendChild(backdrop);
  $('closeModal').onclick = () => backdrop.remove();
  $('paymentForm').onsubmit = async (e) => {
    e.preventDefault();
    try {
      await apiFetch(`/membership-management/members/${memberId}/payments`, { method: 'POST', body: JSON.stringify({
        amountCents: Math.round(Number($('pf_amount').value) * 100), periodStart: $('pf_start').value, periodEnd: $('pf_end').value,
      }) });
      backdrop.remove();
      showToast('Payment recorded', 'success');
      renderMembershipManagement();
    } catch (err) { showToast(err.message, 'error'); }
  };
}

      }) });
      renderInventoryManagement();
    } catch (err) { showToast(err.message, 'error'); }
  };

function openStockAdjustModal(productId, reason) {
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <h3 style="margin-top:0">${reason === 'restock' ? 'Restock' : 'Record a sale'}</h3>
      <form id="adjustForm">
        <div class="field"><label>Quantity</label><input id="adj_qty" type="number" min="1" step="1" required autofocus></div>
        <div class="field"><label>Note (optional)</label><input id="adj_note"></div>
        <button class="btn btn-primary" style="width:100%">${reason === 'restock' ? 'Add stock' : 'Remove stock'}</button>
      </form>
      <button class="btn" id="closeModal" style="width:100%; margin-top:8px;">Cancel</button>
    </div>
  `;
  document.body.appendChild(backdrop);
  $('closeModal').onclick = () => backdrop.remove();
  $('adjustForm').onsubmit = async (e) => {
    e.preventDefault();
    const qty = Number($('adj_qty').value);
    if (!qty) return;
    try {
      await apiFetch(`/inventory-management/products/${productId}/adjust`, { method: 'POST', body: JSON.stringify({
        changeQty: reason === 'restock' ? qty : -qty, reason, note: $('adj_note').value.trim() || undefined,
      }) });
      backdrop.remove();
      renderInventoryManagement();
    } catch (err) { showToast(err.message, 'error'); }
  };
}

async function renderQueueDetailPanel(queueId, queue) {
  let tickets;
  try { ({ tickets } = await apiFetch(`/queue-management/queues/${queueId}/tickets`)); } catch (err) { return showToast(err.message, 'error'); }
  const joinUrl = `${window.location.origin}${window.location.pathname.replace(/index\.html$/, '')}join-queue.html?token=${queue.join_token}`;
  const panel = $('queueDetailPanel');
  panel.innerHTML = `
    <div class="card">
      <h4 style="margin-top:0">${escapeHtml(queue.name)} — today's tickets</h4>
      <div class="row" style="margin-bottom:12px;"><input readonly value="${escapeHtml(joinUrl)}" onclick="this.select()"> <button class="btn btn-sm" id="callNextBtn">Call next</button></div>
      <table><thead><tr><th>#</th><th>Customer</th><th>Status</th><th></th></tr></thead><tbody>
      ${tickets.map((t) => `<tr><td>${t.ticket_number}</td><td>${escapeHtml(t.customer_name || '')}</td>
        <td><span class="status-pill status-${t.status==='served'?'paid':t.status==='called'?'sent':t.status==='cancelled'?'void':'draft'}">${t.status}</span></td>
        <td>${t.status === 'called' ? `<button class="link-btn" data-serve="${t.id}">Mark served</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">No tickets yet today.</td></tr>'}
      </tbody></table>
    </div>
  `;
  $('callNextBtn').onclick = async () => {
    try {
      const { ticket } = await apiFetch(`/queue-management/queues/${queueId}/call-next`, { method: 'POST' });
      if (!ticket) showToast('No one is waiting', '');
      else showToast(`Now calling ticket #${ticket.ticket_number}`, 'success');
      renderQueueDetailPanel(queueId, queue);
    } catch (err) { showToast(err.message, 'error'); }
  };
  panel.querySelectorAll('[data-serve]').forEach((b) => b.onclick = async () => { try { await apiFetch(`/queue-management/tickets/${b.dataset.serve}/served`, { method: 'PATCH' }); renderQueueDetailPanel(queueId, queue); } catch (err) { showToast(err.message, 'error'); } });
}

// ------------------------------------------------------------- Boot -------
function handleBillingRedirect() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('billing') === 'success') showToast('Upgrade successful — welcome to Pro!', 'success');
  if (params.get('billing') === 'cancelled') showToast('Upgrade cancelled — no changes made.', '');
  if (params.has('billing')) window.history.replaceState({}, '', window.location.pathname);
}

async function renderRoot() {
  if (!TOKEN || !USER) return renderAuth();
  handleBillingRedirect();
  if (VIEW === 'invoice-generator') return renderInvoiceGenerator();
  return renderDashboard();
}

renderRoot();
</script>
</body>
</html>
